services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: trip_planner
      POSTGRES_PASSWORD: trip_planner
      POSTGRES_DB: trip_planner
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trip_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
